[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoai"
version = "0.0.1"
description = "YoAi - Personal Agent built on YAI Agent Core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
scheduler = ["croniter>=6"]   # 仅 cron 表达式需要；其余调度功能零依赖

[project.scripts]
yoai = "yoai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
